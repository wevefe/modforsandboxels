<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Sandboxels Mod Constructor v2</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #1e1e2e;
        color: #e0e0e0;
        margin: 0;
        padding: 20px;
        font-size: 14px;
    }
    h1 { color: #89b4fa; margin: 0 0 16px; font-size: 22px; }
    h2 { color: #cba6f7; font-size: 16px; margin: 16px 0 8px; }
    h3 { color: #94e2d5; font-size: 14px; margin: 12px 0 6px; }

    .container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        max-width: 1400px;
        margin: 0 auto;
    }
    @media (max-width: 900px) {
        .container { grid-template-columns: 1fr; }
    }
    .panel {
        background: #2a2a3e;
        border-radius: 8px;
        padding: 16px;
        overflow-y: auto;
        max-height: 90vh;
    }
    label {
        display: block;
        margin-top: 10px;
        margin-bottom: 4px;
        font-size: 13px;
        color: #a6adc8;
    }
    input[type="text"], input[type="number"], select, textarea {
        width: 100%;
        padding: 7px;
        background: #1e1e2e;
        border: 1px solid #45475a;
        border-radius: 4px;
        color: #e0e0e0;
        font-family: inherit;
        font-size: 13px;
    }
    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #89b4fa;
    }
    input[type="color"] {
        width: 50px;
        height: 32px;
        border: none;
        background: none;
        cursor: pointer;
        padding: 0;
    }
    button {
        background: #89b4fa;
        color: #1e1e2e;
        border: none;
        padding: 7px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        margin-top: 6px;
        transition: background 0.15s;
    }
    button:hover { background: #b4befe; }
    button.danger { background: #f38ba8; padding: 7px 10px; }
    button.danger:hover { background: #eba0ac; }
    button.secondary { background: #45475a; color: #e0e0e0; }
    button.secondary:hover { background: #585b70; }
    button.download {
        background: #a6e3a1;
        width: 100%;
        padding: 12px;
        font-size: 15px;
        margin-top: 16px;
    }
    button.download:hover { background: #94e2d5; }

    .tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 12px;
        align-items: center;
    }
    .tab {
        background: #45475a;
        color: #e0e0e0;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        border: 2px solid transparent;
        margin: 0;
    }
    .tab.active {
        background: #89b4fa;
        color: #1e1e2e;
        border-color: #b4befe;
    }
    .tab.has-error { border-color: #f38ba8; }

    .color-row, .reaction-row, .behavior-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
    }
    .reaction-row {
        background: #1e1e2e;
        padding: 10px;
        border-radius: 4px;
        flex-direction: column;
        align-items: stretch;
    }
    .reaction-row label { margin-top: 4px; }
    .behavior-row select { flex: 1; }

    pre {
        background: #11111b;
        padding: 12px;
        border-radius: 4px;
        overflow-x: auto;
        font-size: 12px;
        color: #a6e3a1;
        max-height: 70vh;
        line-height: 1.5;
        margin: 0;
    }
    .toggle-group {
        display: flex;
        gap: 6px;
        margin-top: 6px;
    }
    .toggle-group button {
        flex: 1;
        background: #45475a;
        color: #e0e0e0;
        margin: 0;
    }
    .toggle-group button.active {
        background: #89b4fa;
        color: #1e1e2e;
    }
    .error {
        color: #f38ba8;
        font-size: 12px;
        margin-top: 4px;
        min-height: 16px;
    }
    .success {
        color: #a6e3a1;
        font-size: 12px;
        margin-top: 4px;
    }
    .row-actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
    }
    .row-actions button { flex: 1; margin: 0; }
    .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
    }
    .checkbox-row input { width: auto; }
    .checkbox-row label { margin: 0; }

    /* Кастомные категории */
    .category-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
    }
    .category-row input { flex: 1; }
    .category-hint {
        font-size: 11px;
        color: #6c7086;
        margin-top: 2px;
    }
    .custom-cat-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
    }
    .custom-cat-chip {
        background: #45475a;
        color: #e0e0e0;
        padding: 3px 8px;
        border-radius: 12px;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        border: 1px solid transparent;
    }
    .custom-cat-chip:hover { border-color: #89b4fa; }
    .custom-cat-chip.active {
        background: #89b4fa;
        color: #1e1e2e;
    }
    .custom-cat-chip .remove {
        color: #f38ba8;
        font-weight: bold;
        cursor: pointer;
        padding: 0 2px;
    }
    .custom-cat-chip.active .remove { color: #1e1e2e; }
</style>
</head>
<body>

<h1>🧪 Sandboxels Mod Constructor v2</h1>

<div class="container">
    <!-- ЛЕВАЯ ПАНЕЛЬ -->
    <div class="panel">
        <div class="tabs" id="tabs"></div>
        <button onclick="addElement()">+ Новый элемент</button>

        <div id="editor"></div>

        <div class="row-actions">
            <button class="secondary" onclick="exportJSON()">📤 Экспорт проекта</button>
            <button class="secondary" onclick="document.getElementById('importFile').click()">📥 Импорт</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
        </div>

        <div id="globalError" class="error"></div>

        <button class="download" onclick="downloadMod()">💾 Скачать мод (.js)</button>
        <button class="secondary" style="width:100%;margin-top:8px;" onclick="copyCode()">📋 Копировать код</button>
    </div>

    <!-- ПРАВАЯ ПАНЕЛЬ -->
    <div class="panel">
        <h2>Предпросмотр кода</h2>
        <pre id="preview">// Здесь появится код мода</pre>
        <div id="copyStatus" class="success"></div>
    </div>
</div>

<script>
// ============================================================
// СОСТОЯНИЕ
// ============================================================
let elementsList = [];
let activeIndex = 0;

// Кастомные категории, добавленные пользователем
let customCategories = [];

const DEFAULT_CATEGORIES = [
    'land', 'liquids', 'gases', 'powders', 'solids', 'special',
    'machines', 'tools', 'weapons', 'life', 'food', 'structures'
];

// Возвращает объединённый список категорий (дефолтные + кастомные)
function getAllCategories() {
    const set = new Set([...DEFAULT_CATEGORIES, ...customCategories]);
    return Array.from(set);
}

const BEHAVIORS = [
    'POWDER', 'LIQUID', 'GAS', 'WALL', 'SUPPORT', 'STURDYPOWDER',
    'MUD', 'CLIMB', 'SAND', 'SANDLIKE', 'NONE'
];

const STATES = ['solid', 'liquid', 'gas'];

// ============================================================
// УТИЛИТЫ
// ============================================================
function escapeHTML(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function escapeJS(str) {
    return String(str)
        .replace(/\\/g, '\\\\')
        .replace(/"/g, '\\"')
        .replace(/\n/g, '\\n');
}

function isValidName(name) {
    return /^[a-z_][a-z0-9_]*$/i.test(name);
}

function isValidCategory(name) {
    // Категория: латиница/цифры/_ (без пробелов)
    return /^[a-z_][a-z0-9_]*$/i.test(name);
}

// ============================================================
// УПРАВЛЕНИЕ КАТЕГОРИЯМИ
// ============================================================
function addCustomCategory(name) {
    const trimmed = String(name || '').trim();
    if (!trimmed) return false;
    if (!isValidCategory(trimmed)) return false;
    if (DEFAULT_CATEGORIES.includes(trimmed)) return false;
    if (customCategories.includes(trimmed)) return false;
    customCategories.push(trimmed);
    return true;
}

function removeCustomCategory(name) {
    const idx = customCategories.indexOf(name);
    if (idx === -1) return;
    customCategories.splice(idx, 1);
    // Если у элементов была эта категория — сбрасываем на 'land'
    elementsList.forEach(el => {
        if (el.category === name) el.category = 'land';
    });
    renderEditor();
    updatePreview();
}

// ============================================================
// УПРАВЛЕНИЕ ЭЛЕМЕНТАМИ
// ============================================================
function createDefaultElement() {
    return {
        name: 'my_element',
        category: 'land',
        state: 'solid',
        behavior: ['POWDER'],
        desc: 'A custom element.',
        colorMode: 'single',
        color: '#ff0000',
        colors: ['#ff0000'],
        colorPattern: [],
        usePattern: false,
        reactions: [],
        tempHigh: 1000,
        stateHigh: 'molten_glass',
        tempLow: -50,
        stateLow: 'ice',
        burn: '',
        burnTime: '',
        fireColor: '',
        conduct: false,
        density: '',
        hardness: '',
        breakInto: '',
        hidden: false
    };
}

function addElement() {
    elementsList.push(createDefaultElement());
    activeIndex = elementsList.length - 1;
    renderTabs();
    renderEditor();
    updatePreview();
}

function removeElement(index) {
    if (elementsList.length === 1) {
        if (!confirm('Это последний элемент. Удалить и создать пустой?')) return;
        elementsList[0] = createDefaultElement();
        activeIndex = 0;
    } else {
        if (!confirm('Удалить элемент "' + elementsList[index].name + '"?')) return;
        elementsList.splice(index, 1);
        if (activeIndex >= elementsList.length) activeIndex = elementsList.length - 1;
    }
    renderTabs();
    renderEditor();
    updatePreview();
}

function switchElement(index) {
    activeIndex = index;
    renderTabs();
    renderEditor();
}

function updateActive(field, value) {
    if (!elementsList[activeIndex]) return;
    elementsList[activeIndex][field] = value;
    if (field === 'name') renderTabs();
    updatePreview();
}

// ============================================================
// ПРОВЕРКА ОШИБОК
// ============================================================
function getElementErrors(el, index) {
    const errors = [];
    if (!el.name) errors.push('Имя не указано');
    else if (!isValidName(el.name)) errors.push('Имя: только латиница, цифры и _');
    else {
        const dup = elementsList.findIndex((e, i) => i !== index && e.name === el.name);
        if (dup !== -1) errors.push('Дубликат имени');
    }
    if (el.category && !isValidCategory(el.category)) {
        errors.push('Категория: только латиница, цифры и _');
    }
    return errors;
}

// ============================================================
// РЕНДЕР ВКЛАДОК
// ============================================================
function renderTabs() {
    const tabs = document.getElementById('tabs');
    tabs.innerHTML = '';
    elementsList.forEach((el, i) => {
        const errors = getElementErrors(el, i);
        const btn = document.createElement('button');
        btn.className = 'tab' + (i === activeIndex ? ' active' : '') + (errors.length ? ' has-error' : '');
        btn.textContent = el.name || '(без имени)';
        btn.onclick = () => switchElement(i);
        tabs.appendChild(btn);
    });
}

// ============================================================
// РЕНДЕР РЕДАКТОРА
// ============================================================
function renderEditor() {
    const el = elementsList[activeIndex];
    if (!el) return;
    const editor = document.getElementById('editor');

    const allCats = getAllCategories();

    editor.innerHTML = `
        <h2>Свойства элемента</h2>

        <label>Имя элемента (латиница, цифры, _)</label>
        <input type="text" id="f_name" value="${escapeHTML(el.name)}">
        <div id="nameError" class="error"></div>

        <h3>📂 Категория</h3>
        <label>Выберите или введите свою категорию</label>
        <input type="text" id="f_category" list="categoriesDatalist"
               value="${escapeHTML(el.category)}"
               placeholder="например: my_category">
        <datalist id="categoriesDatalist">
            ${allCats.map(c => `<option value="${escapeHTML(c)}"></option>`).join('')}
        </datalist>
        <div class="category-hint">Можно выбрать из списка или ввести новую (латиница, цифры, _)</div>
        <div id="categoryError" class="error"></div>

        <label>Быстрый выбор:</label>
        <div class="custom-cat-list" id="categoryChips"></div>

        <h3>⚙️ Основные свойства</h3>
        <label>Состояние (state)</label>
        <select id="f_state">
            ${STATES.map(s => `<option value="${s}"${el.state === s ? ' selected' : ''}>${s}</option>`).join('')}
        </select>

        <label>Поведение (можно несколько)</label>
        <div id="behaviorsList"></div>
        <button class="secondary" onclick="addBehavior()">+ Добавить поведение</button>

        <label>Описание</label>
        <textarea id="f_desc" rows="2">${escapeHTML(el.desc)}</textarea>

        <h3>🎨 Цвет</h3>
        <div class="toggle-group">
            <button class="${el.colorMode === 'single' ? 'active' : ''}" onclick="setColorMode('single')">Один</button>
            <button class="${el.colorMode === 'array' ? 'active' : ''}" onclick="setColorMode('array')">Массив</button>
        </div>

        ${el.colorMode === 'single' ? `
            <label>Цвет</label>
            <input type="color" id="f_color" value="${el.color}">
        ` : `
            <label>Цвета</label>
            <div id="colorsList"></div>
            <button class="secondary" onclick="addColor()">+ Добавить цвет</button>
        `}

        <div class="checkbox-row">
            <input type="checkbox" id="f_usePattern" ${el.usePattern ? 'checked' : ''}>
            <label for="f_usePattern">Использовать colorPattern</label>
        </div>

        ${el.usePattern ? `
            <label>ColorPattern (цвета узора)</label>
            <div id="patternsList"></div>
            <button class="secondary" onclick="addPattern()">+ Добавить цвет узора</button>
        ` : ''}

        <h3>🌡️ Температурные переходы</h3>

        <label>tempHigh (нагрев выше)</label>
        <input type="number" id="f_tempHigh" value="${el.tempHigh}">

        <label>stateHigh (во что превращается)</label>
        <input type="text" id="f_stateHigh" value="${escapeHTML(el.stateHigh)}">

        <label>tempLow (охлаждение ниже)</label>
        <input type="number" id="f_tempLow" value="${el.tempLow}">

        <label>stateLow (во что превращается)</label>
        <input type="text" id="f_stateLow" value="${escapeHTML(el.stateLow)}">

        <h3>🔥 Горение</h3>
        <label>burn (% шанс возгорания, 0–100)</label>
        <input type="number" id="f_burn" value="${el.burn}" placeholder="оставьте пустым">

        <label>burnTime (сколько горит)</label>
        <input type="number" id="f_burnTime" value="${el.burnTime}" placeholder="оставьте пустым">

        <label>fireColor (HEX)</label>
        <input type="text" id="f_fireColor" value="${escapeHTML(el.fireColor)}" placeholder="#ff8800">

        <h3>⚙️ Дополнительно</h3>

        <div class="checkbox-row">
            <input type="checkbox" id="f_conduct" ${el.conduct ? 'checked' : ''}>
            <label for="f_conduct">conduct (проводит электричество)</label>
        </div>

        <div class="checkbox-row">
            <input type="checkbox" id="f_hidden" ${el.hidden ? 'checked' : ''}>
            <label for="f_hidden">hidden (скрыт из меню)</label>
        </div>

        <label>density (плотность)</label>
        <input type="number" id="f_density" value="${el.density}" placeholder="например 1000">

        <label>hardness (твёрдость, 0–1)</label>
        <input type="number" id="f_hardness" value="${el.hardness}" step="0.1" placeholder="0.5">

        <label>breakInto (во что превращается при разрушении)</label>
        <input type="text" id="f_breakInto" value="${escapeHTML(el.breakInto)}" placeholder="например sand">

        <h3>⚗️ Реакции</h3>
        <div id="reactionsList"></div>
        <button class="secondary" onclick="addReaction()">+ Добавить реакцию</button>

        <div style="margin-top:20px;">
            <button class="danger" onclick="removeElement(${activeIndex})">🗑 Удалить элемент</button>
        </div>
    `;

    bindInputs();
    renderBehaviors();
    renderCategoryChips();
    if (el.colorMode === 'array') renderColors();
    if (el.usePattern) renderPatterns();
    renderReactions();
    validateName();
    validateCategory();
}

// ============================================================
// ЧИПЫ КАТЕГОРИЙ
// ============================================================
function renderCategoryChips() {
    const el = elementsList[activeIndex];
    const container = document.getElementById('categoryChips');
    if (!container) return;
    container.innerHTML = '';

    getAllCategories().forEach(cat => {
        const chip = document.createElement('span');
        chip.className = 'custom-cat-chip' + (el.category === cat ? ' active' : '');
        chip.textContent = cat;

        // Кнопка удаления — только для кастомных категорий
        if (customCategories.includes(cat)) {
            const remove = document.createElement('span');
            remove.className = 'remove';
            remove.textContent = '×';
            remove.title = 'Удалить категорию';
            remove.onclick = (e) => {
                e.stopPropagation();
                if (confirm(`Удалить категорию "${cat}"? Элементы с ней станут "land".`)) {
                    removeCustomCategory(cat);
                }
            };
            chip.appendChild(remove);
        }

        chip.onclick = () => {
            updateActive('category', cat);
            renderEditor();
        };
        container.appendChild(chip);
    });
}

// ============================================================
// ПРИВЯЗКА ПОЛЕЙ
// ============================================================
function bindInputs() {
    const bind = (id, field, transform = v => v) => {
        const node = document.getElementById(id);
        if (!node) return;
        const handler = () => updateActive(field, transform(node.type === 'checkbox' ? node.checked : node.value));
        node.addEventListener('input', handler);
        node.addEventListener('change', handler);
    };

    bind('f_name', 'name');
    bind('f_category', 'category');
    bind('f_state', 'state');
    bind('f_desc', 'desc');
    bind('f_color', 'color');
    bind('f_tempHigh', 'tempHigh', v => v === '' ? '' : Number(v));
    bind('f_stateHigh', 'stateHigh');
    bind('f_tempLow', 'tempLow', v => v === '' ? '' : Number(v));
    bind('f_stateLow', 'stateLow');
    bind('f_burn', 'burn', v => v === '' ? '' : Number(v));
    bind('f_burnTime', 'burnTime', v => v === '' ? '' : Number(v));
    bind('f_fireColor', 'fireColor');
    bind('f_conduct', 'conduct');
    bind('f_hidden', 'hidden');
    bind('f_density', 'density', v => v === '' ? '' : Number(v));
    bind('f_hardness', 'hardness', v => v === '' ? '' : Number(v));
    bind('f_breakInto', 'breakInto');

    const patternBox = document.getElementById('f_usePattern');
    if (patternBox) {
        patternBox.addEventListener('change', () => {
            updateActive('usePattern', patternBox.checked);
            renderEditor();
        });
    }

    const nameInput = document.getElementById('f_name');
    if (nameInput) nameInput.addEventListener('input', validateName);

    const catInput = document.getElementById('f_category');
    if (catInput) {
        // При вводе новой категории — автоматически добавляем её в список
        catInput.addEventListener('change', () => {
            const val = catInput.value.trim();
            if (val && isValidCategory(val) && !DEFAULT_CATEGORIES.includes(val) && !customCategories.includes(val)) {
                addCustomCategory(val);
                renderCategoryChips();
            }
            validateCategory();
        });
        catInput.addEventListener('input', validateCategory);
    }
}

function validateName() {
    const el = elementsList[activeIndex];
    const errNode = document.getElementById('nameError');
    if (!errNode || !el) return;
    const errors = getElementErrors(el, activeIndex);
    errNode.textContent = errors.join(' • ');
    renderTabs();
}

function validateCategory() {
    const el = elementsList[activeIndex];
    const errNode = document.getElementById('categoryError');
    if (!errNode || !el) return;
    if (el.category && !isValidCategory(el.category)) {
        errNode.textContent = 'Категория: только латиница, цифры и _ (без пробелов)';
    } else {
        errNode.textContent = '';
    }
}

// ============================================================
// ПОВЕДЕНИЯ
// ============================================================
function addBehavior() {
    const el = elementsList[activeIndex];
    el.behavior.push('POWDER');
    renderBehaviors();
    updatePreview();
}

function removeBehavior(index) {
    const el = elementsList[activeIndex];
    el.behavior.splice(index, 1);
    if (el.behavior.length === 0) el.behavior.push('POWDER');
    renderBehaviors();
    updatePreview();
}

function updateBehavior(index, value) {
    elementsList[activeIndex].behavior[index] = value;
    updatePreview();
}

function renderBehaviors() {
    const el = elementsList[activeIndex];
    const list = document.getElementById('behaviorsList');
    if (!list) return;
    list.innerHTML = '';
    el.behavior.forEach((b, i) => {
        const row = document.createElement('div');
        row.className = 'behavior-row';
        const select = document.createElement('select');
        BEHAVIORS.forEach(opt => {
            const o = document.createElement('option');
            o.value = opt;
            o.textContent = opt;
            if (opt === b) o.selected = true;
            select.appendChild(o);
        });
        select.addEventListener('change', () => updateBehavior(i, select.value));

        const btn = document.createElement('button');
        btn.className = 'danger';
        btn.textContent = '×';
        btn.onclick = () => removeBehavior(i);

        row.appendChild(select);
        row.appendChild(btn);
        list.appendChild(row);
    });
}

// ============================================================
// ЦВЕТА
// ============================================================
function setColorMode(mode) {
    const el = elementsList[activeIndex];
    el.colorMode = mode;
    if (mode === 'array' && el.colors.length === 0) el.colors.push('#ffffff');
    renderEditor();
    updatePreview();
}

function addColor() {
    elementsList[activeIndex].colors.push('#ffffff');
    renderColors();

function addReaction() {

function removeReaction(i) {

function renderReactions() {
    const el = elementsList[activeIndex];
    const list = document.getElementById('reactionsList');
    if (!list) return;
    list.innerHTML = '';
    el.reactions.forEach((r, i) => {
        const row = document.createElement('div');

        i1.value = r.target;

        i3.value = r.result2;
        i3.addEventListener('input', () => updateReaction(i, 'result2', i3.value));

// ============================================================
// ГЕНЕРАЦИЯ КОДА
// ============================================================
function buildColorValue(el) {
    if (el.colorMode === 'single') return `"${el.color}"`;
    return `[${el.colors.map(c => `"${c}"`).join(', ')}]`;
}

function buildBehaviorValue(el) {
    if (el.behavior.length === 1) return `behaviors.${el.behavior[0]}`;
    return `[${el.behavior.map(b => `behaviors.${b}`).join(', ')}]`;
}

function buildElementCode(el, indent = '') {
    let code = `${indent}elements.${el.name} = {\n`;
    code += `${indent}    color: ${buildColorValue(el)},\n`;
    code += `${indent}    category: "${escapeJS(el.category)}",\n`;
    code += `${indent}    state: "${escapeJS(el.state)}",\n`;
    code += `${indent}    behavior: ${buildBehaviorValue(el)},\n`;
    code += `${indent}    desc: "${escapeJS(el.desc)}"`;

    if (el.usePattern && el.colorPattern && el.colorPattern.length > 0) {
        code += `,\n${indent}    colorPattern: [${el.colorPattern.map(c => `"${c}"`).join(', ')}]`;
    }

    if (el.reactions && el.reactions.length > 0) {
        code += `,\n\n${indent}    reactions: {\n`;
        el.reactions.forEach((r, i) => {
            const comma = i < el.reactions.length - 1 ? ',' : '';
            const target = (r.target || '').trim() || 'water';
            const elem1 = (r.result || '').trim();
            const elem2 = (r.result2 || '').trim();
            const val1 = elem1 ? `"${escapeJS(elem1)}"` : 'null';
            const val2 = elem2 ? `"${escapeJS(elem2)}"` : 'null';
            code += `${indent}        "${escapeJS(target)}": { elem1: ${val1}, elem2: ${val2} }${comma}\n`;
        });
        code += `${indent}    }`;
    }

    // Температурные переходы — генерируем парами, разделяем запятыми корректно
    const tempPairs = [];
    if (el.tempHigh !== '' && el.tempHigh !== null && el.stateHigh) {
        tempPairs.push(`tempHigh: ${Number(el.tempHigh)}`);
        tempPairs.push(`stateHigh: "${escapeJS(el.stateHigh)}"`);
    }
    if (el.tempLow !== '' && el.tempLow !== null && el.stateLow) {
        tempPairs.push(`tempLow: ${Number(el.tempLow)}`);
        tempPairs.push(`stateLow: "${escapeJS(el.stateLow)}"`);
    }
    if (tempPairs.length > 0) {
        code += `,\n\n${indent}    ${tempPairs.join(`,\n${indent}    `)}`;
    }

    const extras = [];
    if (el.burn !== '' && el.burn !== null) extras.push(`burn: ${Number(el.burn)}`);
    if (el.burnTime !== '' && el.burnTime !== null) extras.push(`burnTime: ${Number(el.burnTime)}`);
    if (el.fireColor) extras.push(`fireColor: "${escapeJS(el.fireColor)}"`);
    if (el.conduct) extras.push(`conduct: true`);
    if (el.hidden) extras.push(`hidden: true`);
    if (el.density !== '' && el.density !== null) extras.push(`density: ${Number(el.density)}`);
    if (el.hardness !== '' && el.hardness !== null) extras.push(`hardness: ${Number(el.hardness)}`);
    if (el.breakInto) extras.push(`breakInto: "${escapeJS(el.breakInto)}"`);

    if (extras.length > 0) {
        code += `,\n${indent}    // дополнительные свойства\n`;
        code += extras.map(l => `${indent}    ${l}`).join(',\n');
    }

    code += `\n${indent}};\n`;
    return code;
}

function buildModCode() {
    if (elementsList.length === 0) return '// Нет элементов';

    const names = elementsList.map(e => e.name);
    const seen = new Set();
    const dupes = names.filter(n => {
        if (seen.has(n)) return true;
        seen.add(n);
        return false;
    });
    if (dupes.length > 0) {
        return `// ⚠️ ОШИБКА: дубликаты имён: ${dupes.join(', ')}\n// Исправьте имена перед скачиванием.`;
    }

    const invalid = elementsList.filter(e => !isValidName(e.name));
    if (invalid.length > 0) {
        return `// ⚠️ ОШИБКА: невалидные имена: ${invalid.map(e => e.name || '(пусто)').join(', ')}\n// Имя должно содержать только латиницу, цифры и _.`;
    }

    const invalidCats = elementsList.filter(e => e.category && !isValidCategory(e.category));
    if (invalidCats.length > 0) {
        return `// ⚠️ ОШИБКА: невалидные категории: ${invalidCats.map(e => e.category).join(', ')}\n// Категория должна содержать только латиницу, цифры и _.`;
    }

    const invalidBehavior = elementsList.filter(e => !Array.isArray(e.behavior) || e.behavior.length === 0);
    if (invalidBehavior.length > 0) {
        return `// ⚠️ ОШИБКА: у элементов не задано поведение: ${invalidBehavior.map(e => e.name).join(', ')}`;
    }

    const sorted = [...elementsList];
    sorted.sort((a, b) => {
        const aRefs = a.reactions.some(r => r.target === b.name);
        const bRefs = b.reactions.some(r => r.target === a.name);
        if (aRefs && !bRefs) return 1;
        if (bRefs && !aRefs) return -1;
        return 0;
    });

    let header = `// Сгенерировано Sandboxels Mod Constructor v2\n`;
    header += `// Элементов: ${sorted.length}\n`;
    header += `// Дата: ${new Date().toLocaleString('ru-RU')}\n\n`;

    // Комментарий со списком кастомных категорий
    if (customCategories.length > 0) {
        header += `// Кастомные категории: ${customCategories.join(', ')}\n\n`;
    }

    let code = header;
    sorted.forEach(el => {
        code += buildElementCode(el);
        code += '\n';
    });

    return code;
}

function updatePreview() {
    document.getElementById('preview').textContent = buildModCode();
}

// ============================================================
// ЭКСПОРТ / ИМПОРТ
// ============================================================
function downloadMod() {
    const code = buildModCode();
    if (code.startsWith('// ⚠️ ОШИБКА')) {
        document.getElementById('globalError').textContent = 'Исправьте ошибки перед скачиванием.';
        return;
    }
    document.getElementById('globalError').textContent = '';

    const name = elementsList[0]?.name || 'mod';
    const blob = new Blob([code], { type: 'text/javascript;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${name}_mod.js`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function copyCode() {
    const code = buildModCode();
    navigator.clipboard.writeText(code).then(() => {
        const status = document.getElementById('copyStatus');
        status.textContent = '✅ Код скопирован!';
        setTimeout(() => status.textContent = '', 2000);
    }).catch(() => {
        document.getElementById('copyStatus').textContent = '❌ Не удалось скопировать';
    });
}

function exportJSON() {
    // Сохраняем и элементы, и кастомные категории
    const data = JSON.stringify({
        elements: elementsList,
        customCategories: customCategories
    }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sandboxels_project.json';
    a.click();
    URL.revokeObjectURL(url);
}

function importJSON(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        try {
            const data = JSON.parse(e.target.result);

            // Поддержка старого формата (просто массив) и нового (объект)
            let elems, cats;
            if (Array.isArray(data)) {
                elems = data;
                cats = [];
            } else if (data && Array.isArray(data.elements)) {
                elems = data.elements;
                cats = Array.isArray(data.customCategories) ? data.customCategories : [];
            } else {
                throw new Error('Неизвестный формат файла');
            }

            if (elems.length === 0) throw new Error('Пустой файл');

            // Нормализация каждого элемента через дефолт — защита от отсутствующих полей
            elementsList = elems.map(el => {
                const merged = Object.assign(createDefaultElement(), el);

                // Гарантируем корректные массивы
                if (!Array.isArray(merged.behavior) || merged.behavior.length === 0) {
                    merged.behavior = ['POWDER'];
                }
                if (!Array.isArray(merged.colors) || merged.colors.length === 0) {
                    merged.colors = ['#ffffff'];
                }
                if (!Array.isArray(merged.colorPattern)) {
                    merged.colorPattern = [];
                }
                if (!Array.isArray(merged.reactions)) {
                    merged.reactions = [];
                }

                // Нормализуем реакции
                merged.reactions = merged.reactions.map(r => ({
                    target: r && r.target ? String(r.target) : 'water',
                    result: r && r.result ? String(r.result) : '',
                    result2: r && r.result2 ? String(r.result2) : ''
                }));

                // Валидируем state
                if (!STATES.includes(merged.state)) {
                    merged.state = 'solid';
                }

                // Валидируем colorMode
                if (merged.colorMode !== 'single' && merged.colorMode !== 'array') {
                    merged.colorMode = 'single';
                }

                return merged;
            });

            // Дедупликация кастомных категорий
            const seenCats = new Set();
            customCategories = cats
                .map(c => String(c).trim())
                .filter(c => {
                    if (!c || !isValidCategory(c)) return false;
                    if (DEFAULT_CATEGORIES.includes(c)) return false;
                    if (seenCats.has(c)) return false;
                    seenCats.add(c);
                    return true;
                });

            activeIndex = 0;
            renderTabs();
            renderEditor();
            updatePreview();
            document.getElementById('globalError').textContent = '';
        } catch (err) {
            document.getElementById('globalError').textContent = 'Ошибка импорта: ' + err.message;
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}
